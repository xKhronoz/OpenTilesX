services:
  bootstrap:
    build: &prepared-build
      context: ..
      target: admin-worker
      args:
        PREPARE_EXTERNAL_DATA_AT_BUILD: "true"
        FETCH_EXTERNAL_DATA_AT_BUILD: "true"
        EXTERNAL_DATA_BUILD_SOURCE_MODE: public
    command: bootstrap
    environment:
      IMPORT_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      DATABASE_ADMIN_URL: postgresql://osm:osm@postgis:5432/gis
    depends_on:
      postgis:
        condition: service_healthy

  postgis:
    image: postgis/postgis:15-3.4
    command:
      - postgres
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=256MB
      - -c
      - checkpoint_completion_target=0.9
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: osm
      POSTGRES_PASSWORD: osm
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osm -d gis"]
      interval: 10s
      timeout: 5s
      retries: 10

  tile-api:
    build:
      <<: *prepared-build
      target: api
    environment:
      RENDER_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      CONTROL_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      TILE_STORE: filesystem
      TILE_FS_PATH: /data/tiles
      EXTERNAL_DATA_MODE: auto
      ADMIN_ENABLED: "true"
      ADMIN_TOKEN: change-me
    volumes:
      - tile-cache:/data/tiles
    ports:
      - "8080:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  render-worker:
    build:
      <<: *prepared-build
      target: renderer
    environment: &prepared-renderer-env
      RENDER_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      CONTROL_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      TILE_STORE: filesystem
      TILE_FS_PATH: /data/tiles
      EXTERNAL_DATA_MODE: auto
      WORKER_ID: render-worker-1
    volumes:
      - tile-cache:/data/tiles
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  render-worker-2:
    build:
      <<: *prepared-build
      target: renderer
    environment:
      <<: *prepared-renderer-env
      WORKER_ID: render-worker-2
    volumes:
      - tile-cache:/data/tiles
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  admin-worker:
    build:
      <<: *prepared-build
      target: admin-worker
    environment:
      IMPORT_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      TILE_STORE: filesystem
      TILE_FS_PATH: /data/tiles
      EXTERNAL_DATA_MODE: auto
    volumes:
      - tile-cache:/data/tiles
      - ../data/import:/data/import:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  postgis-data:
  tile-cache:
