apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tile-server.fullname" . }}-renderer
spec:
  replicas: {{ .Values.renderer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tile-server.fullname" . }}-renderer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tile-server.fullname" . }}-renderer
    spec:
      securityContext:
{{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: renderer
          image: {{ .Values.image.renderer | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "tile-server.fullname" . }}-config
            - secretRef:
                name: {{ include "tile-server.fullname" . }}-secrets
          volumeMounts:
            {{- if eq .Values.tileStore.type "filesystem" }}
            - name: tile-cache
              mountPath: {{ .Values.tileStore.filesystem.path | quote }}
            {{- end }}
            - name: map-bundle
              mountPath: {{ .Values.mapBundle.mountPath | quote }}
              readOnly: true
      volumes:
        {{- if eq .Values.tileStore.type "filesystem" }}
        - name: tile-cache
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-tiles" (include "tile-server.fullname" .)) .Values.tileStore.filesystem.existingClaim }}
        {{- end }}
        - name: map-bundle
          persistentVolumeClaim:
            claimName: {{ .Values.mapBundle.existingClaim | required "mapBundle.existingClaim is required" }}
