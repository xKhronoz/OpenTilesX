x-render-worker-common: &render-worker-common
  build:
    context: ..
    target: renderer
  environment: &render-worker-env
    RENDER_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
    CONTROL_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
    TILE_STORE: s3
    S3_BUCKET: tiles
    S3_PREFIX: osm
    S3_REGION: us-east-1
    S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: minio
    AWS_SECRET_ACCESS_KEY: minio123
    S3_FORCE_PATH_STYLE: "true"
    RENDER_BACKEND: python-mapnik
    RENDER_WORKER_PROCESSES: "1"
    METATILE_SIZE: "8"
    STORE_FULL_METATILE: "true"
    WORKER_BATCH_SIZE: "32"
  depends_on:
    bootstrap:
      condition: service_completed_successfully
    minio:
      condition: service_started
    create-bucket:
      condition: service_completed_successfully

services:
  postgis:
    image: postgis/postgis:15-3.4
    command:
      - postgres
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=256MB
      - -c
      - checkpoint_completion_target=0.9
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: osm
      POSTGRES_PASSWORD: osm
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osm -d gis"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 minio minio123 &&
       mc mb --ignore-existing local/tiles"
    depends_on:
      minio:
        condition: service_started

  bootstrap:
    build:
      context: ..
      target: admin-worker
    command: bootstrap
    environment:
      IMPORT_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      DATABASE_ADMIN_URL: postgresql://osm:osm@postgis:5432/gis
      IMPORT_THREADS: "4"
      EXTERNAL_DATA_MODE: auto
    depends_on:
      postgis:
        condition: service_healthy

  tile-api:
    build:
      context: ..
      target: api
    environment:
      RENDER_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      CONTROL_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      TILE_STORE: s3
      S3_BUCKET: tiles
      S3_PREFIX: osm
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      S3_FORCE_PATH_STYLE: "true"
      RENDER_BACKEND: python-mapnik
      RENDER_WORKER_PROCESSES: "1"
      ADMIN_ENABLED: "true"
      ADMIN_TOKEN: change-me
    ports:
      - "8080:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully

  render-worker:
    container_name: render-worker-1
    <<: *render-worker-common
    environment:
      <<: *render-worker-env
      WORKER_ID: render-worker-1

  render-worker-2:
    container_name: render-worker-2
    <<: *render-worker-common
    environment:
      <<: *render-worker-env
      WORKER_ID: render-worker-2

  admin-worker:
    build:
      context: ..
      target: admin-worker
    environment:
      IMPORT_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      TILE_STORE: s3
      S3_BUCKET: tiles
      S3_PREFIX: osm
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      S3_FORCE_PATH_STYLE: "true"
      IMPORT_THREADS: "4"
      EXTERNAL_DATA_MODE: auto
      NAME_LUA: /opt/openstreetmap-carto-default/openstreetmap-carto.lua
      NAME_STYLE: /opt/openstreetmap-carto-default/openstreetmap-carto.style
      NAME_INDEXES: /opt/openstreetmap-carto-default/indexes.sql
    volumes:
      - ../data/import:/data/import:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  postgis-data:
  minio-data:
