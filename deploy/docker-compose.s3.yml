version: "3.8"

services:
  postgis:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: osm
      POSTGRES_PASSWORD: osm
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osm -d gis"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 minio minio123 &&
       mc mb --ignore-existing local/tiles"
    depends_on:
      minio:
        condition: service_started

  bootstrap:
    build:
      context: ..
      target: admin-worker
    command: bootstrap
    environment:
      IMPORT_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      DATABASE_ADMIN_URL: postgresql://osm:osm@postgis:5432/gis
    depends_on:
      postgis:
        condition: service_healthy

  tile-api:
    build:
      context: ..
      target: api
    environment:
      RENDER_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      CONTROL_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      TILE_STORE: s3
      S3_BUCKET: tiles
      S3_PREFIX: osm
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      S3_FORCE_PATH_STYLE: "true"
      MAP_BUNDLE_URI: file:///data/bundles/default
      ADMIN_ENABLED: "true"
      ADMIN_TOKEN: change-me
    volumes:
      - ../examples/map-bundle:/data/bundles/default:ro
    ports:
      - "8080:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully

  render-worker:
    build:
      context: ..
      target: renderer
    environment:
      RENDER_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      CONTROL_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      TILE_STORE: s3
      S3_BUCKET: tiles
      S3_PREFIX: osm
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      S3_FORCE_PATH_STYLE: "true"
      MAP_BUNDLE_URI: file:///data/bundles/default
    volumes:
      - ../examples/map-bundle:/data/bundles/default:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully

  admin-worker:
    build:
      context: ..
      target: admin-worker
    environment:
      IMPORT_DATABASE_URL: postgresql://osm:osm@postgis:5432/gis
      TILE_STORE: s3
      S3_BUCKET: tiles
      S3_PREFIX: osm
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      S3_FORCE_PATH_STYLE: "true"
      MAP_BUNDLE_URI: file:///data/bundles/default
    volumes:
      - ../data/import:/data/import:ro
      - ../examples/map-bundle:/data/bundles/default:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  postgis-data:
  minio-data:
