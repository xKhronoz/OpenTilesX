name: Build and test role images

on:
  push:
    branches:
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ github.repository_owner }}/openstreetmap-tile-server
  TAG: ${{ github.sha }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests

  build:
    needs:
      - unit-tests
    strategy:
      matrix:
        target:
          - api
          - renderer
          - admin-worker
          - admin-ui
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            arch: amd64
            load: true
          - platform: linux/arm64
            arch: arm64
            load: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Environment
        run: echo "IMAGE=$(echo ${{ env.IMAGE }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          pull: true
          load: ${{ matrix.load }}
          platforms: ${{ matrix.platform }}
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          tags: ${{ env.IMAGE }}-${{ matrix.target }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ github.workflow }}:${{ matrix.platform }}:${{ matrix.target }}
          cache-to: type=gha,scope=${{ github.workflow }}:${{ matrix.platform }}:${{ matrix.target }},mode=max
      - name: Image smoke test
        if: ${{ matrix.load }}
        run: docker run --rm --entrypoint /bin/sh ${{ env.IMAGE }}-${{ matrix.target }}:${{ env.TAG }} -c 'python3 -m py_compile /app/tile_server/*.py'

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      matrix:
        target:
          - api
          - renderer
          - admin-worker
          - admin-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Environment
        run: |
          echo "IMAGE=$(echo ${{ env.IMAGE }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE }}-${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ github.workflow }}:linux/amd64:${{ matrix.target }}
            type=gha,scope=${{ github.workflow }}:linux/arm64:${{ matrix.target }}
          cache-to: type=gha,scope=${{ github.workflow }}:deploy:${{ matrix.target }},mode=max
