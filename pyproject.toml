[project]
name = "openstreetmap-tile-server"
version = "0.1.0"
description = "Cloud-native, airgap-capable OpenStreetMap raster tile server runtime"
authors = [{ name = "OpenStreetMap tile server maintainers" }]
license = "BSD-2-Clause"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "boto3>=1.34,<2.0",
    "osmium>=3.7,<5.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.31,<3.0",
]

[tool.poetry]
packages = [{ include = "tile_server" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
